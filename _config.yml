# Site Settings
locale: "en-US"
title: "Brenda Cruz-González"
title_separator: "|"
name: "Brenda Cruz-González"
description: "Personal academic website of Brenda Cruz-González"
url: "https://bcruzgon.github.io"
baseurl: ""
repository: "bcruzgon/bcruzgon.github.io"

# Site Author
author:
  name: "Brenda Cruz-González"
  avatar: "profile.jpg"
  bio: "Your title/position here"
  location: "City, State"
  employer: "University Name"
  uri:
  email: "your.email@university.edu"
  # orcid: "https://orcid.org/0000-0000-0000-0000"
  # github: "bcruzgon"
  # linkedin: "your-linkedin"
  # googlescholar: "https://scholar.google.com/citations?user=XXXXXX"
  # researchgate: "https://www.researchgate.net/profile/Your-Name"
  # office: "Building Room"

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp

# Build settings
markdown: kramdown
remote_theme: "academicpages/academicpages.github.io"
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jemoji
  - jekyll-include-cache
  - jekyll-remote-theme

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  math_engine: mathjax

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Pagination
paginate: 5
paginate_path: /page:num/
